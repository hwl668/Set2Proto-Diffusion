          min_four_step_gain_over_tuned_no_remask: 0.0005
          min_four_step_gain_over_confidence_one_step: 0.0005
          min_hard_scenario_wins: 2
          max_clean_auc_drop_vs_tuned_no_remask: 0.001
          require_positive_net_correction: true
          require_actual_remask: true
          require_remask_ecr_exceeds_eir: true
          max_permutation_map_difference: 0.00001

  backbone:
    name: adaface_ir50
    architecture: ir_50
    checkpoint_filename: adaface_ir50_webface4m.ckpt
    checkpoint_source: webface4m
    checkpoint_url: https://drive.google.com/file/d/1BmDRrhPsHSbXcWZoYFPJg2KJn1sd3QpN/view
    input_color_order: bgr
    frozen: true
    spatial_hook: auto
    cache_dtype: float16
    cache_batch_size: 128
    cache_max_images_per_split: 0

  model:
    architecture: conditional_transformer
    hidden_dim: 256
    layers: 4
    attention_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    use_frame_index_embedding: false
    use_native_sdpa: true

  training:
    batch_size: 8
    gradient_accumulation: 4
    min_steps: 10000
    max_steps: 20000
    validate_every_steps: 500
    checkpoint_every_steps: 1000
    learning_rate: 0.0003
    weight_decay: 0.01
    warmup_steps: 500
    early_stop_patience: 5
    precision: bf16
    max_grad_norm: 1.0
    label_smoothing: 0.0
    maskgit_min_mask_ratio: 0.05

  decoding:
    default_steps: 4
    evaluation_steps: [1, 2, 4, 8]
    schedule: cosine
    evidence:
      top_k_frames: 3
      lambda_grid: [0.5, 1.0, 2.0]
      default_lambda: 1.0
      stop_gradient: true
      enable_remask: true

  evaluation:
    batch_size: 16
    far_targets: [0.01, 0.001]
    scenarios:
      - clean
      - low_quality
      - complementary_occlusion
      - common_occlusion
      - wrong_identity
    latency_warmup_runs: 20
    latency_measurement_runs: 100
    permutation_trials: 8
    bootstrap_samples: 1000

  runtime:
    require_cuda: true
    deterministic: true
    num_workers: 4
    pin_memory: true
    max_peak_memory_gib: 7.2
    oom_batch_fallback: [8, 4, 2, 1]
    oom_condition_frames_fallback: [4, 3, 2]
    oom_hidden_dim_fallback: [256, 192, 128]

  logging:
    jsonl_filename: events.jsonl
    metrics_filename: metrics.csv
    manifest_filename: run_manifest.json

